<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Medical Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar for Quick Actions -->
        <div class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-notes-medical"></i>
                <h2>AI Medic</h2>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-main">
            <div class="chat-header">
                <h3>Medical Consultation</h3>
                <span class="status"><span class="dot"></span> Online</span>
            </div>
            
            <div class="chat-box" id="chat-box">
                <div class="message ai-message">
                    <div class="avatar"><i class="fa-solid fa-stethoscope"></i></div>
                    <div class="content">
                        Hello! I am your AI medical assistant. How can I help you today? Please note that my responses are not official medical diagnoses. Always consult a real doctor.
                    </div>
                </div>
            </div>
            
            <div class="chat-input-area">
                <div class="image-preview-container" id="image-preview-container" style="display: none;">
                    <img id="image-preview" src="" alt="Selected Preview">
                    <button id="remove-image">&times;</button>
                </div>
                
                <form id="chat-form">
                    <label for="image-upload" class="upload-btn">
                        <i class="fa-solid fa-paperclip"></i>
                    </label>
                    <input type="file" id="image-upload" accept="image/*" style="display: none;">
                    
                    <input type="text" id="message-input" placeholder="Type your symptoms or questions here..." autocomplete="off">
                    <button type="submit" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
                </form>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
